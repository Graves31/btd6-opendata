<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Unofficial, instant-loading browser for Bloons TD 6 events, leaderboards and player profiles." />
    <meta name="theme-color" content="#0a0a0b" />
    <!-- Light / dark picked on the site (theme.tsx), applied before the first paint -->
    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
      // Analytics counts a page view per address change; a query-only change (slider, tab, pager) is the same
      // page. Registered before the beacon's listener, this keeps those from it.
      // ponytail: Navigation API browsers only; elsewhere the beacon patches pushState, so a pager click still counts.
      try {
        navigation.addEventListener("navigate", function (e) {
          if (new URL(e.destination.url).pathname === location.pathname) e.stopImmediatePropagation();
        });
      } catch (e) {}
    </script>
    <title>BTD6 Open Data</title>
    <!-- Site name in search results -->
    <script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"BTD6 Open Data","alternateName":["btd6data","btd6data.com","BTD6 Data"],"url":"https://btd6data.com/"}</script>
    <!-- Site icon: scripts/build_icons.py -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/api/now" as="fetch" crossorigin />
    <link rel="preconnect" href="https://static-api.nkstatic.com" />
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <div id="app"></div>
    <!-- Cloudflare Web Analytics (cookieless; counts SPA route changes as page views) -->
    <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "ab3888cc15e34f12b66327bed3e00042"}'></script>
  </body>
</html>
